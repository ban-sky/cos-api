name: Build cos-api package

on:
  push:
    branches:
      - dev
      - lonely
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --no-dev --prefer-dist

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Create archive
        if: matrix.php == '8.5'
        run: composer build

      - name: Upload artifact
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@v4
        with:
          name: cos-api
          path: cos-api.zip
          if-no-files-found: error
