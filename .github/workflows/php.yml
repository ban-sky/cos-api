name: CI

on:
  push:
    branches:
      - dev
      - main
      - lonely
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, simplexml, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Audit dependencies
        run: composer audit

      - name: Build release zip
        if: matrix.php == '8.5'
        run: |
          rm -f key/config.local.php
          zip -r cos-api.zip \
            index.php api key styles.css favicon.ico vendor \
            README.md SECURITY.md composer.json composer.lock .gitignore

      - name: Upload artifact
        if: matrix.php == '8.5'
        uses: actions/upload-artifact@v4
        with:
          name: cos-api
          path: cos-api.zip
